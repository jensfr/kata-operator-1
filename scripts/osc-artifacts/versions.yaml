shim-v2-go:
  source: "kata-containers upstream source (Go build)"
  ref: "4.2.0"
  components: "containerd-shim-kata-v2, kata-runtime, kata-collect-data.sh, configuration-qemu.toml"
qemu:
  source: "RHEL 9 RPMs"
  components: "qemu-kvm-core, qemu-kvm-common, qemu-img, private libs, firmware"
virtiofsd:
  source: "RHEL 9 RPMs"
  components: "virtiofsd"
osc-guest-support:
  agent-source: "osc-podvm-payload Konflux build"
  osbuilder-source: "kata-containers upstream source + OSC kata-osbuilder.sh"
  components: "kata-agent, osbuilder, dracut config, osc-kata-guest-prep.service"
kata-deploy:
  source: "kata-containers upstream"
  ref: "4.2.0"
  note: "installer binary only; built separately in osc-kata-deploy"
