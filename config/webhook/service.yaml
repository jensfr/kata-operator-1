
apiVersion: v1
kind: Service
metadata:
  name: webhook-service
  namespace: system
  annotations:
    # OpenShift service CA creates the webhook-server-cert secret
    service.beta.openshift.io/serving-cert-secret-name: webhook-server-cert
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    control-plane: controller-manager
