# RBAC for kata-deploy DaemonSet pods
# These resources are needed for `make deploy` without OLM.
# When deploying via OLM, similar permissions are granted through the CSV.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller-manager
  namespace: openshift-sandboxed-containers-operator
---
# Grant controller-manager SA image-builder role for pushing to internal registry
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controller-manager-image-builder
  namespace: openshift-sandboxed-containers-operator
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: openshift-sandboxed-containers-operator
roleRef:
  kind: ClusterRole
  name: system:image-builder
  apiGroup: rbac.authorization.k8s.io
---
# Grant controller-manager SA access to privileged SCC for kata-deploy DaemonSet
# kata-deploy requires hostNetwork, hostPID, hostPath volumes
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: controller-manager-privileged-scc
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: openshift-sandboxed-containers-operator
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:privileged
  apiGroup: rbac.authorization.k8s.io
---
# Grant controller-manager SA the manager-role permissions
# This ensures kata-deploy pods can manage nodes, runtimeclasses, etc.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: controller-manager-manager-role
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: openshift-sandboxed-containers-operator
roleRef:
  kind: ClusterRole
  name: manager-role
  apiGroup: rbac.authorization.k8s.io
